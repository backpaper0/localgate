name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

  release-binary:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build binaries
        run: |
          LDFLAGS="-X 'localgate/internal/version.Version=${{ github.ref_name }}' \
                   -X 'localgate/internal/version.Commit=${{ github.sha }}' \
                   -X 'localgate/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o localgate-linux-amd64   .
          GOOS=linux   GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o localgate-linux-arm64   .
          GOOS=darwin  GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o localgate-darwin-amd64  .
          GOOS=darwin  GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o localgate-darwin-arm64  .
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o localgate-windows-amd64.exe .

      - name: Upload linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            localgate-linux-amd64
            localgate-linux-arm64

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            localgate-linux-amd64 \
            localgate-linux-arm64 \
            localgate-darwin-amd64 \
            localgate-darwin-arm64 \
            localgate-windows-amd64.exe \
            --draft \
            --title "${{ github.ref_name }}"

  release-container:
    needs: [release-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/backpaper0/localgate
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
